# =====================================================================
# EcoHuánuco AI · Mosquitto 2.x — configuración de DESARROLLO (ECO-5)
#   - Acepta conexiones sin usuario (sólo para la red local de pruebas)
#   - Para producción use mosquitto.prod.conf (usuarios + ACL)
# =====================================================================

# Conexiones MQTT de los dispositivos y del backend
listener 1883
protocol mqtt

# WebSockets: permitirá que el Frontend Angular reciba datos en vivo
listener 9001
protocol websockets

allow_anonymous true

# Guarda en disco los mensajes QoS 1/2 pendientes y las sesiones persistentes
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Límites razonables para telemetría pequeña
max_packet_size 4096
max_inflight_messages 50
max_queued_messages 5000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
