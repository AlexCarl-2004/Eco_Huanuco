# =====================================================================
# EcoHuánuco AI · Mosquitto 2.x — configuración de PRODUCCIÓN (ECO-5)
#   - Cada dispositivo se autentica con su propio usuario (= device_id)
#   - Las ACL limitan qué tópicos puede leer/escribir cada cliente
#   - Se recomienda TLS (puerto 8883) cuando el broker esté en internet
# =====================================================================

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

# --- TLS (descomentar al tener certificados) ---
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_packet_size 4096
max_inflight_messages 50
max_queued_messages 5000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
